     styling, so don't rename selectors when tweaking this block further — only the
     values. Same reasoning protects the #summary/#itemsGrid/#searchInput/#updatedAt
     element IDs, the ASSEMBLY_DATA variable, and the "DATA_PLACEHOLDER" comment

     replaces around those exact hooks, so none of them changed here either. */
  :root {

    --panel-border-strong: #2a3266;
    --text: #14192B;
    --muted: #5A6178;
    --muted-dim: #5b6280;
    --brand-blue: #2f43f0;
    --brand-teal: #00e6b8;
    --brand-teal-dim: #00997b;
    --brand-gradient: linear-gradient(135deg, var(--brand-blue) 0%, var(--brand-teal) 100%);
    --good: #00e6b8;
    --warn: #fbbf24;
    --bad: #fb7373;
    --accent-detail: #1895d4; /* same "detail page" accent used on In-Stock/Fill Rate/Inventory Health */
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 28px 80px;
  }
  a { color: inherit; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); margin-bottom: 28px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .summary-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-top: 3px solid var(--accent-detail);
    border-radius: var(--radius);
    padding: 18px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .summary-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: var(--brand-gradient);
    opacity: 0.06;
    pointer-events: none;
  }
  .summary-card:hover { transform: translateY(-3px); border-color: var(--brand-teal); box-shadow: 0 10px 28px rgba(20, 25, 43, 0.12); }
  .summary-card .count { font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; position: relative; }
  .summary-card .label { font-size: 11px; margin-top: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); position: relative; }
  .card-red, .card-yellow, .card-green, .card-total { background: var(--panel); border-color: var(--panel-border); }
  /* Labels used to lead with a colored circle emoji (🔴/🟡/🟢) as the status cue —
     removed in favor of coloring the label text itself directly. */
  .card-red .label { color: var(--bad); }
  .card-yellow .label { color: #a16207; }
  .card-green .label { color: var(--brand-teal-dim); }
  .count-red { color: var(--bad); }
  .count-yellow { color: var(--warn); }
  .count-green { color: var(--good); }
  .count-total { color: var(--brand-teal); }
  .controls { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 8px 16px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search:focus { border-color: var(--brand-teal); box-shadow: 0 0 0 2px rgba(0, 230, 184, 0.15); }
  .filter-btn {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
  }
  .filter-btn:hover { color: var(--text); background: var(--panel-hover); }
  .filter-btn.active-all { background: var(--panel); border-color: var(--panel-border-strong); color: var(--text); }
  /* Same swap as the summary labels above — the button text itself carries the
     status color at all times (not just once active), rather than relying on a
     colored circle emoji next to neutral gray text. */
  #btn-red { color: var(--bad); }
  #btn-yellow { color: #a16207; }
  #btn-green { color: var(--brand-teal-dim); }
  .filter-btn.active-red { background: var(--panel); border-color: var(--bad); color: var(--bad); }
  .filter-btn.active-yellow { background: var(--panel); border-color: var(--warn); color: #a16207; }
  .filter-btn.active-green { background: var(--panel); border-color: var(--brand-teal); color: var(--brand-teal-dim); }
  .items-grid { display: flex; flex-direction: column; gap: 8px; }
  .item-card {
    border-radius: var(--radius);

    cursor: pointer;

  .item-card:hover { border-color: var(--brand-teal); box-shadow: 0 6px 18px rgba(20, 25, 43, 0.08); }
  .item-card.red { border-left: 3px solid var(--bad); }
  .item-card.yellow { border-left: 3px solid var(--warn); }
  .item-card.green { border-left: 3px solid var(--brand-teal); }
  .item-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 46px;
    height: 32px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    padding: 0 8px;
    flex-shrink: 0;
  }
  .badge.red { background: rgba(251, 115, 115, 0.14); color: var(--bad); }
  .badge.yellow { background: rgba(251, 191, 36, 0.16); color: #a16207; }
  .badge.green { background: rgba(0, 230, 184, 0.14); color: var(--brand-teal-dim); }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .expand-icon { font-size: 11px; color: var(--muted-dim); flex-shrink: 0; transition: transform 0.2s; }
  .item-card.expanded .expand-icon { transform: rotate(180deg); }
  .item-detail { display: none; padding: 0 16px 14px; }
  .item-card.expanded .item-detail { display: block; }
  .comp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .comp-table th {
    text-align: left;
    padding: 8px 10px;
    color: var(--muted);
    font-weight: 500;
    border-bottom: 1px solid var(--panel-border);
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .comp-table td { padding: 8px 10px; border-bottom: 1px solid rgba(20, 25, 43, 0.05); color: var(--text); vertical-align: middle; }
  .comp-table tr:last-child td { border-bottom: none; }
  .comp-table tr.bottleneck-row td { font-weight: 600; background: rgba(251, 115, 115, 0.08); }
  .comp-table tr.bottleneck-row td:first-child::before { content: "⚠ "; }
  .can-build-val { font-weight: 700; font-variant-numeric: tabular-nums; }
  .can-build-val.limiting { color: var(--bad); }
  .can-build-val.ok { color: var(--brand-teal-dim); }
  .no-results { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
  .updated-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--panel-border); flex-wrap: wrap; gap: 8px; }
  .updated-text { font-size: 12px; color: var(--muted-dim); }
  .refresh-note { font-size: 12px; color: var(--brand-teal-dim); font-weight: 600; }
</style>

const YELLOW_THRESHOLD = 20;
function getStatus(n) { if (n <= 0) return 'red'; if (n <= YELLOW_THRESHOLD) return 'yellow'; return 'green'; }

let activeFilter = 'all';

function renderSummary() {
  const red = ASSEMBLY_DATA.filter(d => getStatus(d.max_buildable) === 'red').length;
  const yellow = ASSEMBLY_DATA.filter(d => getStatus(d.max_buildable) === 'yellow').length;
  const green = ASSEMBLY_DATA.filter(d => getStatus(d.max_buildable) === 'green').length;
  document.getElementById('summary').innerHTML = `
    <div class="summary-card card-red" onclick="setFilter('red')"><div class="count count-red">${red}</div><div class="label">Can't Build</div></div>
    <div class="summary-card card-yellow" onclick="setFilter('yellow')"><div class="count count-yellow">${yellow}</div><div class="label">Low (≤${YELLOW_THRESHOLD})</div></div>
    <div class="summary-card card-green" onclick="setFilter('green')"><div class="count count-green">${green}</div><div class="label">Healthy</div></div>
    <div class="summary-card card-total" onclick="setFilter('all')"><div class="count count-total">${ASSEMBLY_DATA.length}</div><div class="label">Total Products</div></div>
  `;
}

function setFilter(f) {
  activeFilter = f;
  ['all','red','yellow','green'].forEach(k => {
    document.getElementById('btn-'+k).className = 'filter-btn' + (k === f ? ' active-'+k : '');
  });
  renderItems();
}

function filterItems() { renderItems(); }

function renderItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let items = ASSEMBLY_DATA;
  if (activeFilter !== 'all') items = items.filter(d => getStatus(d.max_buildable) === activeFilter);
  if (q) items = items.filter(d =>
    d.name.toLowerCase().includes(q) ||
    (d.sku && d.sku.toLowerCase().includes(q)) ||
    d.bottleneck.toLowerCase().includes(q) ||
    d.components.some(c => c.name.toLowerCase().includes(q))
  );

  const grid = document.getElementById('itemsGrid');
  if (!items.length) { grid.innerHTML = '<div class="no-results">No products match your filter.</div>'; return; }

  grid.innerHTML = items.map((d, i) => {
    const st = getStatus(d.max_buildable);
    const displayNum = d.max_buildable <= 0 ? '0' : d.max_buildable >= 1000 ? (d.max_buildable/1000).toFixed(1)+'k' : d.max_buildable;
    const comps = [...d.components].sort((a,b) => a.can_build - b.can_build);
    const rows = comps.map(c => {
      const isBN = c.name === d.bottleneck;
      return `<tr class="${isBN ? 'bottleneck-row' : ''}">
        <td>${c.name}</td>
        <td style="text-align:right;color:#94a3b8">${c.qty_per > 1 ? '×'+c.qty_per : '×1'}</td>
        <td style="text-align:right;color:#64748b">${c.available}</td>
        <td style="text-align:right"><span class="can-build-val ${isBN ? 'limiting' : 'ok'}">${c.can_build}</span></td>
      </tr>`;
    }).join('');
    return `<div class="item-card ${st}" id="card-${i}" onclick="toggleCard(${i})">
      <div class="item-header">
        <div class="badge ${st}">${displayNum}</div>
        <div class="item-info">
          <div class="item-name">${d.name}</div>
          <div class="item-meta">Bottleneck: <strong>${d.bottleneck}</strong>${d.sku ? ' · ' + d.sku : ''}</div>
        </div>
        <div class="expand-icon">▼</div>
      </div>
      <div class="item-detail">
        <table class="comp-table">
          <thead><tr><th>Component</th><th style="text-align:right">Per Unit</th><th style="text-align:right">In Stock</th><th style="text-align:right">Can Build</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(i) {
  document.getElementById('card-'+i).classList.toggle('expanded');
}

const updated = ASSEMBLY_DATA[0]?.updated || 'unknown';
document.getElementById('updatedAt').textContent = 'Last updated: ' + updated + ' · stat.io Zoho Inventory';
renderSummary();
renderItems();
</script>
